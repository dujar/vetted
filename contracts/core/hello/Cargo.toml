[package]
name = "hello"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
stylus-sdk = "0.10.9"

[dev-dependencies]
# Enables stylus_sdk::testing (native TestVM) for unit tests only; the feature
# does not reach the wasm build (resolver 2 keeps dev-dep features separate).
stylus-sdk = { version = "0.10.9", features = ["stylus-test"] }

[features]
export-abi = ["stylus-sdk/export-abi"]
# DECLARED, never enabled — same sdk-macro cfg gate as registry/guard (step-7
# quality pass cleared all three lib targets, not just the two it was handed).
contract-client-gen = []
