name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for wasm32 (deploy-artifact shape)
        run: cargo build --workspace --target wasm32-unknown-unknown
        working-directory: contracts
      - name: Native tests (stylus test host)
        run: cargo test --workspace
        working-directory: contracts

  replicas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-action@v1
      # deps are pinned plain files (foundry.lock + .gitmodules), never git
      # submodules — forge hoists submodule installs to the git root, which
      # is wrong for a nested foundry project (see contracts/replicas/README.md)
      - name: Restore pinned deps (plain clones at foundry.lock revs)
        run: |
          cd contracts/replicas
          git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable lib/openzeppelin-contracts-upgradeable
          git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts
      - name: forge build + fingerprint/behavior tests
        run: forge test
        working-directory: contracts/replicas

  scan-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
        working-directory: scan-backend

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/shared/package-lock.json
      - name: TS round-trip (fixtures vs types.ts)
        run: npm ci && npm test
        working-directory: packages/shared
      - name: Rust round-trip (fixtures vs types.rs)
        run: cargo test
        working-directory: packages/shared

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # frontend depends on vetted-shared via file:../packages/shared — npm does
      # not install a file: package's own dependencies, and tsc/vite must resolve
      # viem from packages/shared/abi.ts (step-5; flagged to the step-1 owner).
      - run: npm ci
        working-directory: packages/shared
      - name: tsc + vite build
        run: npm run build
        working-directory: frontend
      - name: vitest
        run: npm test
        working-directory: frontend
